# Single-node Garage (S3-compatible store for the documents). The RPC secret comes from the
# GARAGE_RPC_SECRET environment variable, so no secret lives in this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# must equal AWS_REGION in .env, the app signs its URLs with it
s3_region = "ap-southeast-1"
api_bind_addr = "0.0.0.0:3900"
